plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'com.github.standobyte.jojo'

base { archivesName = 'RipplesOfThePast-Fabric' }
evaluationDependsOn(':core')

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        jojo {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            sourceSet project(':core').sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'jojo-gametest'
        enableGameTests = true
        enableClientGameTests = true
        // Explicit opt-in: accepting terms must remain a local choice, not a repository default.
        eula = providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)
    }
}

// Both GUI scales are tested at this initial size. Resizing a running 26.3 Vulkan
// window stalls its swapchain on this machine, independently of world/HUD state.
loom.runs.named('clientGameTest') {
    programArgs '--width', '1280', '--height', '720'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(':core')
    include project(':core')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

def remainingResources = layout.buildDirectory.dir('generated/remainingResources')
def remainingModels = layout.buildDirectory.dir('generated/remainingStandModels')
tasks.register('convertRemainingResources', Exec) {
    inputs.file('src/main/resources/assets/jojo/textures/item/bucket_fluid_drip_mask.png')
    commandLine 'python3', 'tools/convert_remaining_resources.py'
    inputs.files(fileTree('tools') { include '*remaining*' }, fileTree('migration') { include 'remaining-*.json', 'fixtures/remaining-*.json' },
            fileTree('../src/main/resources'))
    outputs.dir remainingResources
}
tasks.register('generateRemainingStandModels', Exec) {
    commandLine 'python3', 'tools/generate_remaining_stand_models.py'
    inputs.files(fileTree('tools') { include '*remaining*' }, fileTree('migration') { include 'remaining-*.json', 'fixtures/remaining-*.json' },
            fileTree('../src/main/java/com/github/standobyte/jojo/client/render/entity/model/stand'),
            fileTree('../src/main/resources/assets/jojo/bb'), fileTree('../src/main/resources/assets/jojo/textures/entity/stand'))
    outputs.dir remainingModels
}
sourceSets.main.resources.srcDir remainingResources
sourceSets.main.resources.srcDir remainingModels.map { it.dir('resources') }
sourceSets.client.java.srcDir remainingModels.map { it.dir('java') }
tasks.named('processResources') { dependsOn 'convertRemainingResources', 'generateRemainingStandModels' }
tasks.named('compileClientJava') { dependsOn 'generateRemainingStandModels' }
tasks.named('sourcesJar') { dependsOn 'convertRemainingResources', 'generateRemainingStandModels' }

