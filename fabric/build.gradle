jar { from('../LICENSE') { rename { 'LICENSE_RipplesOfThePast' } } }

// A focused client run keeps iteration short without changing the normal complete suite.
tasks.named('processGametestResources') {
    inputs.property 'clientGameTest', providers.gradleProperty('clientGameTest').getOrElse('all')
    doLast {
        def selected = providers.gradleProperty('clientGameTest').getOrNull()
        if (selected != null) {
            def metadata = new File(destinationDir, 'fabric.mod.json')
            def json = new groovy.json.JsonSlurper().parse(metadata)
            def tests = json.entrypoints['fabric-client-gametest'].findAll { it.tokenize('.').last() == selected }
            if (tests.size() != 1) throw new GradleException("Unknown client GameTest: ${selected}")
            json.entrypoints['fabric-client-gametest'] = tests
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}
