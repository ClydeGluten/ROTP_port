plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'com.github.standobyte.jojo'

base { archivesName = 'RipplesOfThePast-Fabric' }
evaluationDependsOn(':core')

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        jojo {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            sourceSet project(':core').sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'jojo-gametest'
        enableGameTests = true
        enableClientGameTests = true
        // Explicit opt-in: accepting terms must remain a local choice, not a repository default.
        eula = providers.gradleProperty('acceptMinecraftEula').map { it.toBoolean() }.getOrElse(false)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(':core')
    include project(':core')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    // Keep original assets as the source of truth. Legacy data packs and mixins are not compatible.
    from('../src/main/resources') {
        include 'logo.png'
        include 'assets/jojo/textures/**'
        include 'assets/jojo/sounds/**'
        include 'assets/jojo/sounds.json'
        include 'assets/jojo/lang/**'
    }
    doLast {
        def languageFile = new File(destinationDir, 'assets/jojo/lang/en_us.json')
        def translations = new groovy.json.JsonSlurper().parse(languageFile)
        translations.putAll([
